# Lumen local stack.
# Run from the repo root:
#   docker compose -f configs/docker/docker-compose.yml up --build
#
# Ollama: by default this file expects Ollama to run on the HOST
# (set OLLAMA_BASE_URL=http://host.docker.internal:11434). To run Ollama in a
# container instead, start with:  --profile ollama

name: lumen

services:
  api:
    build:
      context: ../..
      dockerfile: configs/docker/Dockerfile.api
    ports:
      - "8787:8787"
    environment:
      PORT: "8787"
      OLLAMA_BASE_URL: "${OLLAMA_BASE_URL:-http://host.docker.internal:11434}"
      LUMEN_CHAT_MODEL: "${LUMEN_CHAT_MODEL:-qwen3:8b}"
      LUMEN_EMBED_MODEL: "${LUMEN_EMBED_MODEL:-nomic-embed-text}"
      DATABASE_URL: "postgres://lumen:lumen@db:5432/lumen"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - db

  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: lumen
      POSTGRES_PASSWORD: lumen
      POSTGRES_DB: lumen
    ports:
      - "5432:5432"
    volumes:
      - lumen_pgdata:/var/lib/postgresql/data

  # Optional containerized Ollama. Enable with:  --profile ollama
  ollama:
    image: ollama/ollama:latest
    profiles: ["ollama"]
    ports:
      - "11434:11434"
    volumes:
      - lumen_ollama:/root/.ollama

volumes:
  lumen_pgdata:
  lumen_ollama:
